name: Release

# Stages a version on npm when a version tag is pushed. Tags in this repository have no "v"
# prefix (for example 0.1.0).
#
# Guards:
# - The workflow only stages the version (npm stage publish). Nobody can install it until a
#   maintainer approves it on npmjs.com with two-factor authentication. The trusted publisher
#   on npmjs.com must not allow a direct "npm publish". See docs/guide-releasing.md.
# - The job runs in the "release" environment. Create it in the repository settings
#   (Settings, Environments) and add required reviewers, so a pushed tag alone cannot
#   publish. See docs/guide-releasing.md.
# - The tagged commit must be on the main branch.
# - Every third-party action is pinned to a full commit; the comment names the version.
# - A version with a pre-release part (for example 1.0.0-rc.1) is staged under the
#   "next" dist-tag, never "latest".
#
# No long-lived npm token is used. Staging authenticates through npm trusted publishing
# (OIDC). Trusted publishing must be enabled on npmjs.com for this repository and this
# workflow file (release.yml) after the first manual publish, because the package has to exist
# on the registry before a trusted publisher can be configured. See docs/guide-releasing.md.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, to tell whether the tagged commit is on main.
          fetch-depth: 0

      - name: Check that the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit $GITHUB_SHA is not on main; releases are published from main only" >&2
            exit 1
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Staged publishing needs npm 11.15.0 or newer; Node 22 ships an older npm. The exact
      # version keeps the publish tool the same from one release to the next.
      - run: npm install -g npm@11.21.2

      - name: Check that the tag equals the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not equal package.json version $version" >&2
            exit 1
          fi

      - name: Choose the dist-tag
        id: dist-tag
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/consumer-smoke.mjs

      # Stages the version; it goes live when a maintainer approves it on npmjs.com. The
      # dist-tag is fixed here and cannot be changed at approval.
      - run: npm stage publish --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
