name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  consumer-smoke:
    # Installs the packed tarball, a linked folder and a git snapshot into throwaway
    # projects. The git scenario commits a copy of the checkout in a temporary
    # repository with its own identity, so it needs no git configuration.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: node scripts/consumer-smoke.mjs

  # Browser tests are not run here: vitest browser mode drives the installed Google
  # Chrome (channel "chrome"), and that setup on the runner is not verified yet.
