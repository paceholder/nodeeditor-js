name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# The checks only read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  consumer-smoke:
    # Installs the packed tarball, a linked folder and a git snapshot into throwaway
    # projects. The git scenario commits a copy of the checkout in a temporary
    # repository with its own identity, so it needs no git configuration.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: node scripts/consumer-smoke.mjs

  # Browser tests are not run here: vitest browser mode drives the installed Google
  # Chrome (channel "chrome"), and that setup on the runner is not verified yet.
